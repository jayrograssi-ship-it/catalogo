name: Atualizar catálogo de investimentos
on:
  schedule:
    - cron: "30 9 * * 1-5"   # dias úteis, 09:30 UTC (06:30 em Brasília)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node coletor/coletar.mjs --teste
      - run: node coletor/coletar.mjs
      - name: Guardar catálogo
        run: |
          git config user.name "robo-catalogo"
          git config user.email "robo-catalogo@users.noreply.github.com"
          git add docs/catalogo.json
          git diff --cached --quiet || git commit -m "Catálogo atualizado"
          git push
